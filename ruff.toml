# Shared lint/format config for the single-file tools in this repo.
line-length = 100
target-version = "py39"

[lint]
# Ruff's default set (pyflakes + a slice of pycodestyle) plus import sorting (I).
# E501 (line length) is deliberately omitted — it's left to the formatter, and
# several tools embed long HTML/JS string literals that must not be wrapped.
select = ["E4", "E7", "E9", "F", "I"]

[format]
quote-style = "double"

[lint.isort]
# workstream imports itself by name; without this ruff files
# `from workstream.x import y` as third-party and `from workstream import x`
# as first-party, and demands they sit in different blocks.
known-first-party = ["workstream"]
