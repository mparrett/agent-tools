[project]
name = "claude-reel"
version = "0.1.0"
description = "Render a Claude Code session as a paced, collapsed slideshow to catch up on what you missed."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
claude-reel = "claude_reel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_reel"]

[dependency-groups]
dev = ["pytest"]
