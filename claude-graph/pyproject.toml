[project]
name = "claude-graph"
version = "0.1.0"
description = "Discover and visualize how Claude Code sessions interconnect."
requires-python = ">=3.11"
dependencies = ["rich", "blessed"]

[project.scripts]
claude-graph = "claude_graph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claude_graph"]

[dependency-groups]
dev = ["pytest"]
