[project]
name = "workstream"
version = "0.1.0"
description = "Durable workstreams across Claude, subagent and Codex sessions: match, attach, show, frontier, retire."
requires-python = ">=3.11"
dependencies = ["rich", "blessed"]

[project.scripts]
workstream = "workstream.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workstream"]

[dependency-groups]
dev = ["pytest"]
